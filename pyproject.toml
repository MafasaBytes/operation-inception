[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operation-inception"
version = "0.1.0"
description = "A reproducible laboratory for procedural motion experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
inception = "inception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
